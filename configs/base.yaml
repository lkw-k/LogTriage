# log-anomaly-classifier 기본 설정
# 이 파일이 label_map 의 유일한 정본이다. 코드에 복사하지 말 것. (CLAUDE.md 절대규칙 3)

seed: 42

paths:
  raw_bgl:    data/raw/BGL.log
  raw_nasa:   data/raw/nasa.csv
  parsed:     data/interim/bgl_parsed.parquet
  labeled:    data/interim/bgl_labeled.parquet
  normalized: data/interim/bgl_norm.parquet
  processed:  data/processed
  runs:       runs

# ---------------------------------------------------------------- 라벨 매핑
# 41개 원본 카테고리 -> 4클래스.
# 매핑되지 않은 카테고리가 하나라도 있으면 label_map 은 에러로 중단한다.
label_map:
  normal:     ["-"]
  kernel_mem: [KERNDTLB, KERNSTOR, KERNMICRO, KERNMC, KERNFLOAT, KERNBIT, KERNTLBE]
  kernel_ops: [KERNMNTF, KERNTERM, KERNREC, KERNRTSP, KERNMNT, KERNSOCK,
               KERNPOW, KERNSERV, KERNPAN, KERNCON, KERNNOETH, KERNPROG,
               KERNRTSA, KERNEXT]
  app:        [APPSEV, APPREAD, APPRES, APPUNAV, APPTO, APPOUT, APPBUSY,
               APPCHILD, APPALLOC, APPTORUS]

# 학습·평가에서 제외. unknown 메커니즘 검증용으로만 사용 (총 271건)
# macro F1 계산에 포함하지 않는다.
holdout_rare: [LINKIAP, LINKDISC, LINKPAP, LINKBLL,
               MASABNORM, MASNORM, MONPOW, MONNULL, MONILL, MMCS]

# ---------------------------------------------------------------- 분할
split:
  by: unix_ts        # 오름차순 정렬 기준. 랜덤 분할 금지.
  ratios: [0.70, 0.15, 0.15]

# ---------------------------------------------------------------- 샘플링
sample:
  strategy: none     # none | ratio | balanced | dedup | cap. train 에만 적용.
  ratio_normal_to_alert: 3   # strategy=ratio 일 때 정상 = 이상합계 * 3
  cap_per_template: 2000     # strategy=cap 일 때 템플릿당 최대 행 수.
                             # train 은 고유 템플릿 16,945종에 194.7배 중복이다.
                             # 2000 이면 3,299,255 -> 332,955 줄이면서
                             # 정상 비율 92.25% -> 92.28% 로 사실상 유지된다.
                             # dedup(완전 제거)은 kernel_mem 이 9줄로 무너진다.

# ---------------------------------------------------------------- 입력 구성
dataset:
  input_mode: msg_only   # msg_only | with_meta
                         # with_meta 는 component+level 을 붙인다. E5 비교용이며 대표 성능이 아니다.
  max_length: 64         # 확정. bert-base-uncased 토큰 길이 실측 결과,
                         # 64 에서 kernel_mem/kernel_ops/app 이 100% 무손실,
                         # normal 97.98%. 32 로 줄이면 app 의 53.4%, kernel_ops 의
                         # 77.4% 만 남아 알럿 클래스가 잘린다 (macro F1 직격).

# ---------------------------------------------------------------- 학습
train:
  model_name: bert-base-uncased
  num_labels: 4
  loss: cross_entropy
  class_weight: true     # w_c = N / (K * n_c). strategy=balanced 이면 false.
  optimizer: adamw
  learning_rate: 2.0e-5
  weight_decay: 0.01
  scheduler: linear
  warmup_ratio: 0.1
  batch_size: 32
  max_epochs: 5
  early_stopping:
    metric: val_macro_f1   # val_macro_f1 | inner_val_macro_f1 | inner_val_unseen_macro_f1
                           # inner_* 는 train.py --inner-val-frac 을 함께 줘야 한다.
                           # val_macro_f1 은 test 의 대리 지표가 아니다 (docs/RISKS.md A).
    patience: 2

# ---------------------------------------------------------------- 평가
evaluate:
  primary_metric: macro_f1   # accuracy 는 대표 지표로 쓰지 않는다 (정상 92.7%)
  n_error_samples: 50

# ---------------------------------------------------------------- 추론 / 판정
# 평시 기준선(class_ratio_mean/std)은 calibrate 가 train 구간에서 계산해
# runs/<exp_id>/calibration.json 에 저장한다. 추론 시 실시간 재계산 금지.
infer:
  window: 1min
  conf_threshold: 0.65   # 최대 softmax 확률이 이 값 미만이면 unknown. val 에서 확정할 것.
  min_count: 5           # 비율 판정에 필요한 최소 건수 (로그 적은 구간 오탐 방지)
  z_warning: 3.0
  z_critical: 5.0
  # 평시 기준선에서 뺄 장애 구간 [시작, 끝). 학습 데이터는 건드리지 않고
  # calibrate 의 class_ratio_mean/std 계산에서만 뺀다.
  # train 의 kernel_mem 217,821행 중 215,673행(99.0%)이 이 3일에 몰려 있어,
  # 포함하면 mean+3σ 임계가 0.6068 이 되어 구간의 61%가 kernel_mem 이어야
  # warning 이 뜬다. experiments.md 2026-08-27 항목 참조.
  baseline_exclude:
    - ["2005-06-12", "2005-06-15"]
  unknown_ratio_warning: 0.10
  top_samples: 3

# ---------------------------------------------------------------- 발생량 감지기
traffic:
  bucket: 1min
  ewma_span: 60
  z_threshold: 3.0
  outage_minutes: 5  # 연속 0건이 이 분 수 이상이고 0 이 시작되기 직전 기준선이
                     # min_baseline 이상이면 무응답(outage). z-score 는 완전 정지를
                     # 표현하지 못한다 — EWMA 가 정지를 새 평시로 학습해 z 가 -2.48
                     # 에서 멈추고(임계 -3 미달), 25분 뒤 watchable 이 꺼져 나머지
                     # 37.6시간을 놓친다. NASA 62일에서 16건 = 0.26건/일.
                     # experiments.md 2026-08-28 항목 참조.
  min_baseline: 20   # 기준선이 분당 이 건수 미만이면 트래픽 판정을 건너뛴다.
                     # BGL 은 로그가 있는 분이 10% 뿐이라 조용한 구간에서 잔차
                     # 표준편차가 0 에 붙어 z 가 폭주한다. 가드 없이 val 에서
                     # |z|>3 이 하루 20건, 가드 20 이면 1.5건이다.
