[project]
name = "log-anomaly-classifier"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib==3.11.1",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.0",
    "torch==2.13.0",
    "tqdm==4.70.0",
    "transformers==5.15.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# torch 는 PyPI 기본 휠이 CPU 전용이라 CUDA 인덱스를 명시한다.
# RTX 4070 = Ada(sm_89). cu130 휠도 있으나 검증 폭이 넓은 cu126 을 쓴다.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
